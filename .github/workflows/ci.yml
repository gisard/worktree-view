name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm test
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: worktree-view-${{ matrix.os }}
          path: |
            *.vsix
            release/*.zip
          if-no-files-found: error
          retention-days: 14
